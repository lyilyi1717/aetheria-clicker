name: Feature idea
description: Suggest something new or better for the game. Ideas are worked on by most 👍.
title: "[Feature] "
labels: [community, feature]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Features are picked up by most 👍 (after open bugs).
        Before posting, check the in-game **Community** tab or the open issues: if your idea is already listed, add a 👍 to it instead.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and why would it make the game more fun?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown in the game header, e.g. v4.7.0
