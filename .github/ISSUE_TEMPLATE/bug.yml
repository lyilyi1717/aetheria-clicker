name: Bug report
description: Something in the game is broken or wrong. Bugs are fixed before features.
title: "[Bug] "
labels: [community, bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping fix Aetheria! Bugs are worked on first, most 👍 first.
        Before posting, check the in-game **Community** tab or the open issues: if your bug is already listed, add a 👍 to it instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you know them (which tab, what you clicked).
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown in the game header, e.g. v4.7.0
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: e.g. Chrome on Android, Safari on iPhone, Firefox on Windows
