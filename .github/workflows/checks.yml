name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: npm test

  pacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Blocking since R4: fails when the casual profile misses the year-one pacing targets
      # (TARGETS in sim/core-pacing.mjs). pipefail keeps the sim's exit code through tee.
      - name: Core pacing check
        shell: bash
        run: |
          set -o pipefail
          npm run sim:check | tee -a "$GITHUB_STEP_SUMMARY"
