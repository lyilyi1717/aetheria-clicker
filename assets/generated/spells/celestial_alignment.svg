  </defs>
  <circle cx="64" cy="64" r="50" fill="url(#starChartGlow)"/>
  <!-- Astrological Astrolabe Ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#c7d2fe" stroke-width="2.5" stroke-dasharray="4,6"/>
