<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Bronze Pickaxe">
  <defs>
    <linearGradient id="bronze-wood" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3e1a06"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="bronze-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="bronze-specular" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="bronze-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#bronze-shadow)">
    <!-- Polished Sturdy Handle -->
    <path d="M 22 110 L 16 104 L 82 38 L 88 44 Z" fill="url(#bronze-wood)" stroke="#271104" stroke-width="2"/>

    <!-- Bronze Pommel Cap -->
    <path d="M 14 102 L 20 108 L 18 114 L 10 110 L 10 104 Z" fill="url(#bronze-metal)" stroke="#451a03" stroke-width="1.8"/>

    <!-- Dual Heavy Bronze Reinforcing Bands -->
    <rect x="36" y="80" width="8" height="12" rx="2" transform="rotate(-45 40 86)" fill="url(#bronze-metal)" stroke="#451a03" stroke-width="1.2"/>
    <rect x="52" y="64" width="8" height="12" rx="2" transform="rotate(-45 56 70)" fill="url(#bronze-metal)" stroke="#451a03" stroke-width="1.2"/>

    <!-- Heavy Bronze Head Collar with Rivets -->
    <path d="M 74 42 L 84 32 L 96 44 L 86 54 Z" fill="url(#bronze-metal)" stroke="#451a03" stroke-width="2"/>
    <circle cx="82" cy="40" r="1.8" fill="#fef08a" stroke="#78350f" stroke-width="0.8"/>
    <circle cx="88" cy="46" r="1.8" fill="#fef08a" stroke="#78350f" stroke-width="0.8"/>

    <!-- Hammered Bronze Pickaxe Head -->
    <path d="M 42 20 
             C 64 30, 84 40, 94 46 
             C 108 52, 116 70, 120 86 
             C 116 82, 110 74, 104 66 
             C 98 58, 88 54, 82 52 
             C 72 44, 56 32, 46 24 
             Z" 
          fill="url(#bronze-metal)" stroke="#451a03" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Central Ridge / Specular Edge of the Blade -->
    <path d="M 44 22 C 68 34, 88 44, 102 58 C 110 68, 116 78, 120 86" 
          fill="none" stroke="url(#bronze-specular)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Back Wedge / Crowbill Spiked Peak -->
    <path d="M 42 20 L 34 14 L 38 24 L 46 24 Z" fill="url(#bronze-metal)" stroke="#451a03" stroke-width="1.8"/>

    <!-- Specular Star Sparkle on Tip -->
    <polygon points="120,86 118,83 120,80 122,83" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
