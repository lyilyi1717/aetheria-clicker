<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="chestWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <radialGradient id="goldShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="64" cy="66" r="46" fill="url(#goldShine)"/>
  <!-- Chest Base -->
  <path d="M24 64 L104 64 L98 106 L30 106 Z" fill="url(#chestWood)" stroke="#1c1917" stroke-width="4"/>
  <!-- Chest Iron Straps -->
  <rect x="36" y="64" width="8" height="42" fill="#78716c" stroke="#292524" stroke-width="1.5"/>
  <rect x="84" y="64" width="8" height="42" fill="#78716c" stroke="#292524" stroke-width="1.5"/>
  <!-- Chest Open Lid (Tilted back) -->
  <path d="M22 64 Q64 36 106 64 L102 50 Q64 22 26 50 Z" fill="url(#chestWood)" stroke="#1c1917" stroke-width="4"/>
  <path d="M36 44 Q64 26 92 44" fill="none" stroke="#78716c" stroke-width="5"/>
  <!-- Overflowing Gold Coins and Dinar Gems -->
  <ellipse cx="64" cy="62" rx="34" ry="14" fill="#ca8a04"/>
  <ellipse cx="48" cy="58" rx="10" ry="7" fill="url(#goldCoin)" stroke="#854d0e" stroke-width="1.5"/>
  <ellipse cx="64" cy="56" rx="11" ry="8" fill="url(#goldCoin)" stroke="#854d0e" stroke-width="1.5"/>
  <ellipse cx="80" cy="59" rx="10" ry="7" fill="url(#goldCoin)" stroke="#854d0e" stroke-width="1.5"/>
  <ellipse cx="56" cy="64" rx="9" ry="6" fill="url(#goldCoin)" stroke="#854d0e" stroke-width="1.5"/>
  <ellipse cx="72" cy="64" rx="9" ry="6" fill="url(#goldCoin)" stroke="#854d0e" stroke-width="1.5"/>
  <ellipse cx="42" cy="68" rx="8" ry="5.5" fill="url(#goldCoin)" stroke="#854d0e" stroke-width="1.5"/>
  <ellipse cx="86" cy="68" rx="8" ry="5.5" fill="url(#goldCoin)" stroke="#854d0e" stroke-width="1.5"/>
  <!-- Front Lock & Ruby Clasp -->
  <rect x="58" y="68" width="12" height="16" rx="2" fill="#eab308" stroke="#713f12" stroke-width="2"/>
  <circle cx="64" cy="76" r="3.5" fill="#dc2626"/>
  <!-- Gleam Stars -->
  <polygon points="34,40 37,46 43,49 37,52 34,58 31,52 25,49 31,46" fill="#ffffff" filter="url(#sparkle)"/>
  <polygon points="94,42 96,47 101,49 96,51 94,56 92,51 87,49 92,47" fill="#ffffff" filter="url(#sparkle)"/>
</svg>
