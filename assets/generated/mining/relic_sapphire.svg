<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Dallah of Sapphire -->
  <defs>
    <linearGradient id="silverDallah" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="sapphireGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="sapphireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="50" fill="url(#sapphireGlow)"/>
  <!-- Curved Dallah Spout -->
  <path d="M68 66 Q88 56 102 36 Q98 48 80 72 Z" fill="url(#silverDallah)" stroke="#1e293b" stroke-width="2"/>
  <!-- Handle -->
  <path d="M46 54 Q20 64 24 92 Q34 98 48 88" fill="none" stroke="url(#silverDallah)" stroke-width="6" stroke-linecap="round"/>
  <!-- Finial Spear Tip -->
  <polygon points="64,12 67,26 61,26" fill="url(#silverDallah)" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Lid Dome -->
  <path d="M50 36 Q64 22 78 36 Z" fill="url(#silverDallah)" stroke="#1e293b" stroke-width="2"/>
  <!-- Main Body Silhouette -->
  <path d="M52 36 L76 36 L72 58 Q82 72 82 88 Q82 104 64 106 Q46 104 46 88 Q46 72 56 58 Z" fill="url(#silverDallah)" stroke="#1e293b" stroke-width="3"/>
  <!-- Sapphire Heart Inlay -->
  <polygon points="64,68 74,78 64,96 54,78" fill="url(#sapphireGem)" stroke="#0369a1" stroke-width="2"/>
  <polygon points="64,72 70,78 64,88 58,78" fill="#e0f2fe" opacity="0.75"/>
  <!-- Pedestal Base -->
  <ellipse cx="64" cy="108" rx="20" ry="6" fill="url(#silverDallah)" stroke="#1e293b" stroke-width="2"/>
</svg>
