<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Steel Pickaxe">
  <defs>
    <linearGradient id="steel-wood" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="steel-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="steel-bevel" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="steel-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="steel-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#steel-shadow)">
    <!-- Dark Treated Hardwood Shaft -->
    <path d="M 22 110 L 16 104 L 82 38 L 88 44 Z" fill="url(#steel-wood)" stroke="#09090b" stroke-width="2"/>

    <!-- Steel Pommel Spike -->
    <path d="M 16 104 L 22 110 L 14 118 L 8 112 Z" fill="url(#steel-blade)" stroke="#0f172a" stroke-width="1.8"/>

    <!-- Dual Heavy Steel Reinforcement Straps -->
    <path d="M 32 94 L 40 86 L 46 92 L 38 100 Z" fill="url(#steel-blade)" stroke="#0f172a" stroke-width="1.2"/>
    <path d="M 52 74 L 60 66 L 66 72 L 58 80 Z" fill="url(#steel-blade)" stroke="#0f172a" stroke-width="1.2"/>

    <!-- Forged Steel Collar with Hex Socket Rivets -->
    <path d="M 72 40 L 84 28 L 98 42 L 86 54 Z" fill="url(#steel-blade)" stroke="#0f172a" stroke-width="2"/>
    <circle cx="82" cy="38" r="2.2" fill="#e2e8f0" stroke="#1e293b" stroke-width="1"/>
    <circle cx="90" cy="46" r="2.2" fill="#e2e8f0" stroke="#1e293b" stroke-width="1"/>

    <!-- Bevelled Steel Pickaxe Head Upper Half -->
    <path d="M 38 18 
             C 62 28, 84 38, 94 44 
             C 108 50, 118 68, 122 88 
             C 118 84, 112 76, 104 68 
             C 98 60, 88 54, 82 52 
             C 70 42, 54 30, 44 22 
             Z" 
          fill="url(#steel-blade)" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Razor Bevel Lower Facet -->
    <path d="M 40 20 
             C 66 32, 88 44, 98 50 
             C 110 56, 118 72, 122 88 
             L 104 68 
             C 96 58, 86 54, 82 52 
             Z" 
          fill="url(#steel-bevel)" opacity="0.65"/>

    <!-- Razor-Sharp Chrome Edge Ridge -->
    <path d="M 40 20 C 66 32, 88 44, 102 58 C 112 70, 118 80, 122 88" 
          fill="none" stroke="url(#steel-edge)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rear Chisel Pick Strike Plate -->
    <path d="M 38 18 L 28 10 L 32 24 L 44 24 Z" fill="url(#steel-blade)" stroke="#0f172a" stroke-width="2"/>
    <path d="M 28 10 L 32 14 L 32 24 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Sharp Gleam Starburst -->
    <polygon points="122,88 119,84 122,80 125,84" fill="#ffffff"/>
    <circle cx="122" cy="88" r="1.5" fill="#38bdf8"/>
  </g>
</svg>
