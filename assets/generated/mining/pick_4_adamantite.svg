<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Adamantite Pickaxe">
  <defs>
    <linearGradient id="adam-shaft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="adam-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="65%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="adam-vein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="adam-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.75"/>
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#adam-glow)">
    <!-- Dragon-Bone Bound Shaft -->
    <path d="M 22 110 L 16 104 L 82 38 L 88 44 Z" fill="url(#adam-shaft)" stroke="#064e3b" stroke-width="2"/>

    <!-- Gold Gilded Pommel Spike -->
    <path d="M 14 102 L 20 108 L 10 122 L 6 114 Z" fill="url(#adam-vein)" stroke="#78350f" stroke-width="1.8"/>

    <!-- Spiked Obsidian Reinforcements -->
    <polygon points="34,92 42,84 46,92 38,100" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
    <polygon points="54,72 62,64 66,72 58,80" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>

    <!-- Heavy Dragon-Maw Adamantite Collar -->
    <path d="M 70 42 L 84 26 L 100 42 L 86 58 Z" fill="url(#adam-blade)" stroke="#022c22" stroke-width="2.2"/>
    <polygon points="84,32 92,42 84,52 76,42" fill="url(#adam-vein)"/>

    <!-- Heavy Spiked Adamantite Pickaxe Head -->
    <path d="M 32 14 
             C 58 24, 82 34, 94 42 
             C 108 48, 120 68, 126 92 
             C 120 86, 114 74, 104 66 
             C 98 58, 88 52, 82 50 
             C 70 40, 50 26, 38 18 
             Z" 
          fill="url(#adam-blade)" stroke="#022c22" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Serrated Upper Spine Teeth -->
    <polygon points="56,22 62,16 66,26" fill="url(#adam-blade)" stroke="#022c22" stroke-width="1.5"/>
    <polygon points="76,30 82,24 86,34" fill="url(#adam-blade)" stroke="#022c22" stroke-width="1.5"/>
    <polygon points="96,40 102,34 106,44" fill="url(#adam-blade)" stroke="#022c22" stroke-width="1.5"/>

    <!-- Molten Golden Magma Veins Coursing Through Core -->
    <path d="M 40 18 
             Q 64 28, 82 42 
             T 106 62 
             T 124 90" 
          fill="none" stroke="url(#adam-vein)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Branching Vein -->
    <path d="M 82 42 Q 92 46, 100 50" fill="none" stroke="url(#adam-vein)" stroke-width="1.5"/>

    <!-- Rear Crushing Breaker Beak -->
    <path d="M 32 14 L 14 6 L 22 22 L 38 18 Z" fill="url(#adam-blade)" stroke="#022c22" stroke-width="2"/>
    <polygon points="14,6 10,2 18,6" fill="url(#adam-vein)"/>

    <!-- Gem Facet Glints -->
    <polygon points="126,92 121,87 126,82 131,87" fill="#fef08a"/>
    <circle cx="84" cy="42" r="2" fill="#ffffff"/>
  </g>
</svg>
