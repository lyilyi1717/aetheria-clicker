<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Misbaha of Diamond -->
  <defs>
    <radialGradient id="diaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamondFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="50" fill="url(#diaGlow)"/>
  <!-- Rosary Loop Path (Circle of Diamonds) -->
  <circle cx="64" cy="52" r="32" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="2,4"/>
  <!-- Beads around loop -->
  <!-- Top, sides, and lower beads -->
  <circle cx="64" cy="20" r="6" fill="url(#diamondFacet)" stroke="#3730a3" stroke-width="1.5"/>
  <circle cx="82" cy="26" r="6" fill="url(#diamondFacet)" stroke="#3730a3" stroke-width="1.5"/>
  <circle cx="94" cy="40" r="6" fill="url(#diamondFacet)" stroke="#3730a3" stroke-width="1.5"/>
  <circle cx="96" cy="58" r="6" fill="url(#diamondFacet)" stroke="#3730a3" stroke-width="1.5"/>
  <circle cx="88" cy="74" r="6" fill="url(#diamondFacet)" stroke="#3730a3" stroke-width="1.5"/>
  <circle cx="46" cy="26" r="6" fill="url(#diamondFacet)" stroke="#3730a3" stroke-width="1.5"/>
  <circle cx="34" cy="40" r="6" fill="url(#diamondFacet)" stroke="#3730a3" stroke-width="1.5"/>
  <circle cx="32" cy="58" r="6" fill="url(#diamondFacet)" stroke="#3730a3" stroke-width="1.5"/>
  <circle cx="40" cy="74" r="6" fill="url(#diamondFacet)" stroke="#3730a3" stroke-width="1.5"/>
  <!-- Focal Master Minaret Bead (Imam) -->
  <polygon points="64,74 72,84 64,102 56,84" fill="url(#diamondFacet)" stroke="#312e81" stroke-width="2"/>
  <!-- Silk/Silver Tassel -->
  <path d="M64 102 L60 120 M64 102 L64 122 M64 102 L68 120" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Brilliant Cut Sparkles -->
  <polygon points="64,36 67,46 76,48 67,51 64,62 61,51 52,48 61,46" fill="#ffffff"/>
</svg>
