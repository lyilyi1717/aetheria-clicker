<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Rusty Pickaxe">
  <defs>
    <linearGradient id="rust-wood" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="rust-rope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="rust-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="45%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="rust-patch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Wooden Shaft (diagonal bottom-left to center-right) -->
    <path d="M 22 110 L 16 104 L 82 38 L 88 44 Z" fill="url(#rust-wood)" stroke="#271104" stroke-width="2"/>
    <!-- Wood grain notches -->
    <path d="M 32 94 L 38 100 M 46 80 L 52 86 M 60 66 L 66 72" stroke="#271104" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Handle Wrapping / Rag -->
    <path d="M 28 104 L 20 96 L 36 80 L 44 88 Z" fill="url(#rust-rope)" stroke="#451a03" stroke-width="1.5"/>
    <path d="M 23 99 L 39 83 M 27 103 L 43 87" stroke="#451a03" stroke-width="1.2"/>

    <!-- Iron Neck Collar -->
    <path d="M 76 44 L 84 36 L 94 46 L 86 54 Z" fill="#334155" stroke="#1e293b" stroke-width="1.8"/>
    <!-- Rust on collar -->
    <circle cx="85" cy="45" r="2.5" fill="url(#rust-patch)"/>

    <!-- Rusty Pickaxe Head (Curved Chipped Arc) -->
    <!-- Top-left blunt hammer to bottom-right curved sharp pick -->
    <path d="M 46 22 
             C 66 32, 86 42, 94 46 
             C 106 52, 114 68, 118 84 
             C 114 80, 108 72, 102 66 
             C 96 58, 86 54, 82 52 
             C 72 44, 58 34, 48 26 
             C 44 23, 42 20, 46 22 Z" 
          fill="url(#rust-iron)" stroke="#1e293b" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Back Hammer Bevel -->
    <path d="M 46 22 L 40 18 L 44 28 L 50 30 Z" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Pitted Rust Patches & Chips on Pick Blade -->
    <path d="M 88 52 C 92 56, 96 62, 102 70" stroke="url(#rust-patch)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="78" cy="40" r="3" fill="url(#rust-patch)"/>
    <circle cx="98" cy="62" r="2" fill="url(#rust-patch)"/>
    <circle cx="108" cy="74" r="1.8" fill="url(#rust-patch)"/>

    <!-- Chipped Notch on Pick Edge -->
    <path d="M 104 68 L 102 71 L 106 72 Z" fill="#0f172a"/>
  </g>
</svg>
