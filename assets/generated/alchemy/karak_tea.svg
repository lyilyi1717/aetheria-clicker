<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="teaLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <radialGradient id="teaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="50" fill="url(#teaGlow)"/>
  <!-- Steaming Tea Vapors -->
  <path d="M50 34 Q44 20 54 10 M64 30 Q70 18 62 8 M78 34 Q86 20 76 10" fill="none" stroke="#fed7aa" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Traditional Estikana / Glass Cup -->
  <path d="M42 38 L86 38 L78 98 Q76 106 64 106 Q52 106 50 98 Z" fill="#ffffff" opacity="0.25" stroke="#fef08a" stroke-width="2.5"/>
  <!-- Liquid Fill -->
  <path d="M44 48 L84 48 L76 96 Q74 104 64 104 Q54 104 52 96 Z" fill="url(#teaLiquid)"/>
  <!-- Cinnamon Stick stirring -->
  <line x1="72" y1="26" x2="56" y2="86" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
  <!-- Creamy Froth Layer at top -->
  <ellipse cx="64" cy="48" rx="20" ry="5" fill="#fef3c7"/>
  <!-- Cardamom Seed Floating -->
  <ellipse cx="60" cy="48" rx="3" ry="2" fill="#451a03"/>
  <!-- Saucer Plate -->
  <ellipse cx="64" cy="110" rx="38" ry="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
</svg>
