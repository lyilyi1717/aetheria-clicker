  <line x1="10" y1="128" x2="50" y2="128" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="24" y1="176" x2="68" y2="176" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
