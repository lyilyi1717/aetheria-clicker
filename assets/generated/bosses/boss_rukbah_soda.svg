  <!-- Radioactive Fizz Bubbles popping -->
  <circle cx="70" cy="40" r="8" fill="#bef264"/>
  <circle cx="186" cy="46" r="10" fill="#bef264"/>
  <circle cx="196" cy="94" r="6" fill="#bef264"/>
