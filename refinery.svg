<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Oil Refinery">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#3b2a1a"/>
      <stop offset="0.75" stop-color="#1c140d"/>
      <stop offset="1" stop-color="#120c08"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="0.45" stop-color="#d1d5db"/>
      <stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" x2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6a35c"/>
      <stop offset="1" stop-color="#8a5a2b"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="70%" r="60%">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="200" height="200" fill="url(#sky)"/>
    <!-- flare stack -->
    <rect x="148" y="52" width="6" height="90" fill="url(#steel)"/>
    <path d="M151 22c7 9 9 17 4 26c-2 4-7 5-9 1c-3-6 1-10 2-16c1-4 2-7 3-11z" fill="url(#flame)"/>
    <!-- distillation columns -->
    <rect x="40" y="58" width="18" height="92" rx="4" fill="url(#steel)"/>
    <rect x="64" y="40" width="22" height="110" rx="5" fill="url(#steel)"/>
    <g stroke="#374151" stroke-width="1.5">
      <line x1="40" y1="78" x2="58" y2="78"/><line x1="40" y1="100" x2="58" y2="100"/><line x1="40" y1="122" x2="58" y2="122"/>
      <line x1="64" y1="62" x2="86" y2="62"/><line x1="64" y1="86" x2="86" y2="86"/><line x1="64" y1="110" x2="86" y2="110"/>
    </g>
    <!-- catwalk ladder -->
    <g stroke="#fbbf24" stroke-width="1.2" opacity="0.8">
      <line x1="88" y1="44" x2="88" y2="148"/><line x1="92" y1="44" x2="92" y2="148"/>
    </g>
    <!-- pipes -->
    <path d="M58 132h40v-28h52" fill="none" stroke="#9ca3af" stroke-width="4"/>
    <path d="M86 70h18v60" fill="none" stroke="#6b7280" stroke-width="3"/>
    <!-- storage tanks -->
    <ellipse cx="122" cy="146" rx="22" ry="5" fill="#78350f"/>
    <rect x="100" y="118" width="44" height="28" fill="url(#tank)"/>
    <ellipse cx="122" cy="118" rx="22" ry="5" fill="#fcd34d"/>
    <rect x="152" y="128" width="30" height="20" fill="url(#tank)"/>
    <ellipse cx="167" cy="128" rx="15" ry="3.5" fill="#fcd34d"/>
    <!-- oil drop emblem -->
    <path d="M122 124c5 7 8 11 8 15a8 8 0 0 1-16 0c0-4 3-8 8-15z" fill="#111827" stroke="#fde68a" stroke-width="1.2"/>
    <!-- desert ground -->
    <path d="M0 146c30-8 60-6 100-2s70 4 100-4v60H0z" fill="url(#sand)"/>
    <path d="M0 168c40-6 80-2 120 2s60 0 80-4" fill="none" stroke="#e7c38a" stroke-width="2" opacity="0.5"/>
  </g>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.7"/>
</svg>
