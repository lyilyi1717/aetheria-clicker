<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dig (prototype)</title>
  <link rel="stylesheet" href="proto/proto.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <h1 data-t="title">Dig</h1>
      <span class="tagline" data-t="tagline"></span>
      <span class="grow"></span>
      <span id="chips"></span>
      <button id="auto" class="ghost"></button>
      <button id="mute" class="ghost"></button>
    </header>

    <div class="layout">
      <aside class="side" id="left"></aside>

      <section class="mid">
        <div id="goal"><span id="goal-text"></span><div class="bar"><i id="goal-fill"></i></div></div>
        <div id="stage">
          <canvas id="cv" width="640" height="680"></canvas>
          <div id="hud-coins"><svg width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#ffd23f" stroke="#7a5a00" stroke-width="2.4"/><circle cx="16" cy="16" r="8" fill="none" stroke="#b98a00" stroke-width="2"/><circle cx="11.5" cy="11" r="2.6" fill="#fff6c8"/></svg><b id="coins">0</b></div>
          <div id="hud-depth"><b id="depth">0 m</b></div>
          <div id="combo"></div>
          <div id="toast"></div>
          <div id="banner"></div>
          <div id="hint" data-t="hint_start"></div>
          <div id="tools" hidden></div>
        </div>
      </section>

      <aside class="side" id="right"></aside>
    </div>

    <footer>
      <span data-t="footer"></span>
      <button id="reset" class="ghost" data-t="reset"></button>
    </footer>
  </div>
  <div id="modal"></div>
  <script type="module" src="proto/main.js"></script>
</body>
</html>
