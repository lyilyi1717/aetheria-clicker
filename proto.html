<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dig (prototype)</title>
  <link rel="stylesheet" href="proto/proto.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <h1 data-t="title">Dig</h1>
      <span class="tagline" data-t="tagline"></span>
      <span class="grow"></span>
      <span id="stars" class="stars" hidden><svg width="20" height="20" viewBox="0 0 32 32"><path d="M16 3 L20 12 L30 13 L22.5 19.5 L25 29 L16 24 L7 29 L9.5 19.5 L2 13 L12 12 Z" fill="#ffd23f" stroke="#7a5a00" stroke-width="2"/></svg><b id="stars-n">0</b></span>
      <button id="mute" class="ghost"></button>
    </header>

    <div class="layout">
      <aside class="side" id="left">
        <section class="panel">
          <h2 data-t="relics"></h2>
          <p class="muted" id="relic-none" data-t="relics_none"></p>
          <div id="relic-list"></div>
        </section>
        <section class="panel" id="museum" hidden>
          <h2 data-t="museum"></h2>
          <p class="muted" id="museum-none" data-t="museum_none"></p>
          <div id="museum-list"></div>
        </section>
        <section class="panel" id="site" hidden>
          <h2 data-t="site_title"></h2>
          <p id="site-now"></p>
          <p class="muted" id="site-d"></p>
          <p id="site-get"></p>
          <p class="muted" id="site-keep"></p>
          <button id="site-btn" class="primary" hidden></button>
        </section>
      </aside>

      <section class="mid">
        <div id="goal"><span id="goal-text"></span><div class="bar"><i id="goal-fill"></i></div></div>
        <div id="stage">
          <canvas id="cv" width="640" height="680"></canvas>
          <div id="hud-coins"><svg width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#ffd23f" stroke="#7a5a00" stroke-width="2.4"/><circle cx="16" cy="16" r="8" fill="none" stroke="#b98a00" stroke-width="2"/><circle cx="11.5" cy="11" r="2.6" fill="#fff6c8"/></svg><b id="coins">0</b></div>
          <div id="hud-depth"><b id="depth">0 m</b></div>
          <div id="combo"></div>
          <div id="toast"></div>
          <div id="banner"></div>
          <div id="hint" data-t="hint_start"></div>
          <button id="chest-btn" hidden><span data-t="chest_btn"></span><b id="chest-n">1</b></button>
        </div>
      </section>

      <aside class="side" id="right">
        <section class="panel">
          <h2 data-t="shop"></h2>
          <div id="shop-list"></div>
          <p class="muted" id="shop-locked"></p>
        </section>
      </aside>
    </div>

    <footer>
      <span data-t="footer"></span>
      <button id="reset" class="ghost" data-t="reset"></button>
    </footer>
  </div>
  <div id="modal"></div>
  <script type="module" src="proto/main.js"></script>
</body>
</html>
